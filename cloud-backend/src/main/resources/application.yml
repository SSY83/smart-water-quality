server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: smart-water-quality
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/smart_water_quality?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/smart_water_quality

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.waterquality.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mqtt:
  broker-url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
  client-id: ${spring.application.name}-${random.int}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  qos: 1
  topics:
    - /wqi/+/sensor_data
    - /wqi/+/image_analysis
  connection-timeout: 10
  keep-alive-interval: 30

websocket:
  heartbeat-interval: 30
  max-connection: 500

jwt:
  secret: ${JWT_SECRET:YTIwMjYtc21hcnQtd2F0ZXItcXVhbGl0eS1zZWNyZXQta2V5LWZvci1od3NfMjU2}
  expiration: 86400000
  refresh-threshold: 1800000

sms:
  api-url: https://api.smsprovider.com/v2/send
  api-key: ${SMS_API_KEY:}
  retry-max: 3
  retry-intervals: 1,2,4
  connect-timeout: 3
  read-timeout: 5
  circuit-breaker:
    failure-threshold: 5
    open-duration: 600
    half-open-max-requests: 1

fusion:
  image-weight: 0.6
  sensor-weight: 0.4
  time-window-ms: 500
  turbidity-threshold: 80.0
  cod-threshold: 50.0

cache:
  query-ttl: 300
  session-prefix: "session:"
  session-ttl: 86400
  query-prefix: "query:"

alert:
  threshold:
    turbidity:
      mild: 5.0
      moderate: 30.0
      severe: 80.0
    cod:
      mild: 15.0
      moderate: 30.0
      severe: 50.0
    ph:
      min: 6.5
      max: 8.5

logging:
  level:
    root: INFO
    com.waterquality: DEBUG
  file:
    path: logs
    max-size: 100MB
    max-history: 30
