server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:waterquality}
  http2:
    enabled: ${HTTP2_ENABLED:true}

spring:
  application:
    name: smart-water-quality
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/smart_water_quality?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 10000
      pool-name: WaterQualityHikariPool
      validation-timeout: 3000
    read:
      enabled: ${DB_READ_ENABLED:false}
      url: jdbc:mysql://${DB_READ_HOST:localhost}:${DB_READ_PORT:3306}/smart_water_quality?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_READ_USERNAME:root}
      password: ${DB_READ_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 5000
        idle-timeout: 300000
        max-lifetime: 1200000
        pool-name: WaterQualityReadHikariPool

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/smart_water_quality

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.waterquality.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mqtt:
  broker-url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
  client-id: ${spring.application.name}-${random.int}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  qos: 1
  topics:
    - /wqi/+/sensor_data
    - /wqi/+/image_analysis
    - /wqi/+/heartbeat
  connection-timeout: 10
  keep-alive-interval: 30

websocket:
  heartbeat-interval: 30
  max-connection: 500

jwt:
  secret: ${JWT_SECRET:YTIwMjYtc21hcnQtd2F0ZXItcXVhbGl0eS1zZWNyZXQta2V5LWZvci1od3NfMjU2}
  expiration: 86400000
  refresh-threshold: 1800000

sms:
  provider: ${SMS_PROVIDER:mock}
  api-url: https://api.smsprovider.com/v2/send
  api-key: ${SMS_API_KEY:}
  retry-max: 3
  retry-intervals: 1,2,4
  connect-timeout: 3
  read-timeout: 5
  circuit-breaker:
    failure-threshold: 5
    open-duration: 600
    half-open-max-requests: 1
  aliyun:
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:水质监测}
    template-code: ${SMS_TEMPLATE_CODE:SMS_123456789}
    region-id: cn-hangzhou

fusion:
  image-weight: 0.6
  sensor-weight: 0.4
  time-window-ms: 500
  turbidity-threshold: 80.0
  cod-threshold: 50.0

cache:
  query-ttl: 300
  session-prefix: "session:"
  session-ttl: 86400
  query-prefix: "query:"

alert:
  threshold:
    turbidity:
      mild: 5.0
      moderate: 30.0
      severe: 80.0
    cod:
      mild: 15.0
      moderate: 30.0
      severe: 50.0
    ph:
      min: 6.5
      max: 8.5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true
  info:
    app:
      name: ${spring.application.name}
      version: 2.1.0

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.waterquality: DEBUG

grpc:
  server:
    port: ${GRPC_PORT:9090}
    enabled: ${GRPC_ENABLED:true}
    max-inbound-message-size: 10485760
  client:
    keepalive-time-sec: 30
    keepalive-timeout-sec: 10
