# 本地开发模式 — 仅需 MySQL，其他服务可选
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/smart_water_quality?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:YTIwMjYtc21hcnQtd2F0ZXItcXVhbGl0eS1zZWNyZXQta2V5LWZvci1od3NfMjU2}
  expiration: 86400000
  refresh-threshold: 1800000

sms:
  provider: mock

mqtt:
  broker-url: ${MQTT_HOST:}

websocket:
  heartbeat-interval: 30

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.waterquality: DEBUG
    org.springframework.data.redis: OFF
